# Multi-Administrador · nginx: sirve la SPA y hace de proxy inverso de la API.
#
# /api/login  ->  http://backend:8000/login
# Con esto el navegador siempre habla con un ÚNICO origen (el del frontend):
# no hay CORS, no importa si entras por localhost, por la IP de la LAN o por
# un túnel, y el puerto del backend puede cambiarse sin recompilar el front.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subida de documentos.
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------------- API (proxy inverso) ----------------
    # ^~ evita que el regex de estáticos capture una ruta de la API.
    # El resolver es el DNS interno de Docker: si el contenedor backend se
    # recrea y cambia de IP, nginx vuelve a resolverlo en cada petición.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend "backend:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---------------- Estáticos generados por Vite ----------------
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ---------------- Service Worker (notificaciones push) ----------------
    # Debe servirse desde la raíz para tener scope "/" y SIN caché: así el
    # navegador detecta enseguida una versión nueva del service worker.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ---------------- SPA fallback (React Router) ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
